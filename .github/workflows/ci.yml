name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "python/requirements.txt"

      - name: Require npm lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json deve ser commitado antes da publicação." }

      - name: Install Node dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Install Python runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r python/requirements.txt

      - name: JavaScript syntax checks
        run: npm run check:js

      - name: Python syntax checks
        run: python -m compileall -q python tests scripts

      - name: Crypto round-trip tests
        run: python -m unittest discover -s tests -v

      - name: Public repository audit
        run: python scripts/public-release-audit.py
